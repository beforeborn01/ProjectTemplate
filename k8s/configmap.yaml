apiVersion: v1
kind: ConfigMap
metadata:
  name: template-config
  labels:
    app: template
data:
  # Nacos 配置
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: "nacos-headless.middleware:8848"
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: "nacos-headless.middleware:8848"
  SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: "prod"
  SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: "prod"
  # 数据库配置（非敏感部分）
  JDBC_URL: "jdbc:mysql://mysql-primary.middleware:3306/db?useSSL=false&allowMultiQueries=true"
  JDBC_USERNAME: "app"
  # Redis 配置（非敏感部分）
  REDIS_HOST: "redis-master.middleware"
  REDIS_PORT: "6379"

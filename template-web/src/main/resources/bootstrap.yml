#nacos配置中心和服务发现 相关配置
spring:
  application:
    name: template
  cloud:
    config:
      profile: dev
    nacos:
      config:
        server-addr: http://127.0.0.1:8848
        file-extension: yaml
        namespace: troy
        extension-configs:
          - data-id: application-${spring.cloud.config.profile}.yaml
            group: ${spring.cloud.config.profile}
            refresh: true
          - data-id: ${spring.application.name}-${spring.cloud.config.profile}.yaml
            group: ${spring.cloud.config.profile}
            refresh: true
      discovery:
        server-addr: http://127.0.0.1:8848
        namespace: troy
        service: ${spring.application.name}
        group: ${spring.cloud.config.profile}
        cluster-name: DEFAULT
        metadata:
          version: 1.0
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        ip-delete-timeout: 30000


########################

# 健康检查相关配置
management:
  endpoints:
    web:
      exposure:
        include: 'prometheus,health' #暴露prometheus端点、health端点，其他隐藏
  endpoint:
    health:
      show-details: NEVER
  health:
    defaults:
      enabled: false
# web服务端口号
server:
  port: 9915

# log配置
logging:
  level:
    com.youneng.template.dao.mapper: DEBUG
    org:
      springframework:
        web:
          servlet:
            mvc:
              method:
                annotation:
                  RequestMappingHandlerMapping: trace # 配置启动时打印web url映射


#nacos配置中心和服务发现 相关配置
spring:
  application:
    name: template
  # 优雅停机配置
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # Spring AI - OpenAI 配置
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
          temperature: 0.7
  cloud:
    config:
      profile: dev
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:http://127.0.0.1:8848}
        file-extension: yaml
        namespace: troy
        extension-configs:
          - data-id: application-${spring.cloud.config.profile}.yaml
            group: ${spring.cloud.config.profile}
            refresh: true
          - data-id: ${spring.application.name}-${spring.cloud.config.profile}.yaml
            group: ${spring.cloud.config.profile}
            refresh: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:http://127.0.0.1:8848}
        namespace: troy
        service: ${spring.application.name}
        group: ${spring.cloud.config.profile}
        cluster-name: DEFAULT
        metadata:
          version: 1.0
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        ip-delete-timeout: 30000


########################

# 健康检查相关配置
management:
  endpoints:
    web:
      exposure:
        include: 'prometheus,health,info' #暴露prometheus、health、info端点
  endpoint:
    health:
      show-details: WHEN_AUTHORIZED
      probes:
        enabled: true  # 启用 K8s 探针: /actuator/health/liveness, /actuator/health/readiness
  health:
    defaults:
      enabled: true

# web服务端口号
server:
  port: 9915
  shutdown: graceful  # 优雅停机，配合K8s preStop hook

# log配置
logging:
  level:
    com.youneng.template.dao.mapper: DEBUG
    org:
      springframework:
        web:
          servlet:
            mvc:
              method:
                annotation:
                  RequestMappingHandlerMapping: trace # 配置启动时打印web url映射

# 配置飞书群机器人报警
# FEISHU_WEBHOOK_URL：飞书群机器人 Webhook 地址（从群机器人配置页面获取）
# FEISHU_SECRET：签名校验密钥（开启签名校验时填写，否则留空）
basealert:
  feishu:
    enable: ${FEISHU_ALERT_ENABLE:true}
    webhook: ${FEISHU_WEBHOOK_URL:}
    secret: ${FEISHU_SECRET:}


## //todo 下面配置仅为本地环境使用，正式项目可能要删除以下配置
jdbc:
  url: jdbc:mysql://localhost:3306/db?useSSL=false&allowMultiQueries=true
  username: root
  password: Admin123!
redis:
  host: 127.0.0.1
  port: 88881

mysql:
  configLocation: classpath:mybatis-config.xml
  tiger:
    mapperLocations: classpath*:/mapper/**/*.xml
seal:
  route:
    enable: true
    data-source-map:
      normal:
        master: 'masterDataSource'
      preTest:
        master: 'dataSource_preTest'
    data-source-config-map:
      masterDataSource:
        url: ${jdbc.url}
        username: root
        password: Admin123!
        driver-class-name: com.mysql.cj.jdbc.Driver
      dataSource_preTest:
        url: ${jdbc.url}
        username: root
        password: Admin123!
        driver-class-name: com.mysql.cj.jdbc.Driver
db:
  druid:
    url: ${jdbc.url}
    username: ${jdbc.username}
    password: ${jdbc.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

# jetcache 缓存配置 示例
jetcache:
  statIntervalMinutes: 15
  areaInCacheName: false
  local:
    default:
      type: linkedhashmap
      keyConvertor: jackson
      limit: 500
      expireAfterWriteInMillis: 600000 # 十分钟失效
  remote:
    default:
      type: redis
      keyConvertor: jackson
      valueEncoder: java
      valueDecoder: java
      expireAfterWriteInMillis: 600000
      poolConfig:
        minIdle: 5
        maxIdle: 20
        maxTotal: 50
      host: ${redis.host}
      port: ${redis.port}
      database: 13